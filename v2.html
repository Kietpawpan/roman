<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมถอดอักษรไทยเป็นอักษรโรมัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://css.gg/c?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Inter', sans-serif;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-6 md:p-8 space-y-6 fade-in">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
                ถอดอักษรไทยเป็นอักษรโรมัน
            </h1>
            <p class="text-slate-500 mt-2">
                Thai Romanization (ตามหลัก RTGS)
            </p>
        </div>

        <!-- Input Area -->
        <div class="space-y-2">
            <label for="thai-input" class="font-semibold text-slate-700">ข้อความภาษาไทย</label>
            <textarea id="thaiName" rows="6" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200" placeholder="ตัว-อย่าง การ-พิมพ์-ข้อ-มูล" oninput="romanize()"></textarea>
        </div>

        <!-- Output Area -->
        <div class="space-y-2">
            <label for="roman-output" class="font-semibold text-slate-700">อักษรโรมัน</label>
            <div class="relative">
                <textarea id="romanize" rows="6" readonly class="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 text-slate-700 transition duration-200" placeholder="ผลลัพธ์จะปรากฏที่นี่..."></textarea>
                <button id="copy-btn" class="absolute top-2 right-2 bg-slate-200 text-slate-600 hover:bg-blue-500 hover:text-white rounded-md px-3 py-1 text-sm font-medium transition-colors duration-200" onclick="copy()">
                    คัดลอก
                </button>
            </div>
            <div id="copy-feedback" class="text-green-600 text-sm h-4 transition-opacity duration-300 opacity-0">คัดลอกแล้ว!</div>
        </div>
        
        <!-- Action Buttons -->
        <div class="flex justify-end">
             <button id="clear-btn" onclick="clearText()" class="bg-slate-500 text-white hover:bg-slate-600 rounded-lg px-5 py-2 font-semibold transition-colors duration-200">
                ล้างข้อมูล
            </button>
        </div>
        
        <!-- Footer Note -->
        <div class="text-center text-xs text-slate-400 pt-4 border-t border-slate-200">
            <p>โปรแกรมนี้ใช้หลักการถอดเสียงตามระบบของราชบัณฑิตยสภา (RTGS)</p>
            <p>&copy; 2025 Monte Kietpawpan</p>
        </div>

    </div>
		<script src="js/roman.js"></script>

  

</body>
</html>
